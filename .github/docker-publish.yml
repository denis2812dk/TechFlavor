name: Build and Push to Docker Hub

on:
  push:
    branches: [ "main", "master" ] 

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio en la máquina virtual de GitHub
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Configurar Docker Buildx (permite construcciones más rápidas y eficientes)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Iniciar sesión en Docker Hub usando los secretos que guardamos antes
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 4. Construir y subir la imagen del BackEnd
    - name: Build and Push BackEnd
      uses: docker/build-push-action@v5
      with:
        context: ./BackEnd                  # Le dice a GitHub dónde buscar el Dockerfile del back
        push: true                          # Indica que sí queremos subirlo a Docker Hub
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/techflavor-backend:latest

    # 5. Construir y subir la imagen del FrontEnd
    - name: Build and Push FrontEnd
      uses: docker/build-push-action@v5
      with:
        context: ./FrontEnd                 # Le dice a GitHub dónde buscar el Dockerfile del front
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/techflavor-frontend:latest